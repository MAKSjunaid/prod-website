name: Deploy website
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['frontend/**']
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Tell Render to deploy (mine)
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
      - name: Tell Render to deploy (Nabil)
        if: ${{ !cancelled() }}
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_NABIL }}"
